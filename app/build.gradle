apply plugin: 'com.android.application'

android {
    namespace 'ray.droid.com.droidcatchnotification'

    signingConfigs {
        config {
            keyAlias 'raynotifykey'
            keyPassword 'robray1976'
            storeFile file('C:/Users/Robson/Google Drive/Google Play/RayNotifyKeyStore')
            storePassword 'robray1976'
        }
    }
    compileSdk 36

    defaultConfig {
        applicationId "ray.droid.com.droidcatchnotification"
        minSdk 19
        targetSdk 36
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.android.support:appcompat-v7:26.1.0'
    implementation 'com.google.android.gms:play-services-auth:11.6.0'
    implementation 'com.google.android.gms:play-services-drive:11.6.0'
    implementation 'com.android.support.constraint:constraint-layout:1.0.2'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.1'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.1'
}
